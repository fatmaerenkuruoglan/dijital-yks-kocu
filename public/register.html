<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - Dijital YKS Koçunuz</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-container">
        <div class="form-section">
            <div class="form-wrapper">
                <header>
                    <p class="welcome-text">Hoşgeldiniz.</p>
                    <h1>Kayıt Ol</h1>
                    <p class="login-link">Zaten bir hesabın var mı? <br>
                        <a href="login.html">Buradan giriş yapabilirsin!</a>
                    </p>
                </header>

                <form id="registerForm">
                    <div class="input-group">
                        <label for="ad">Adınız</label>
                        <div class="input-wrapper">
                            <span class="icon">👤</span>
                            <input type="text" id="ad" placeholder="Adınızı girin" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="soyad">Soyadınız</label>
                        <div class="input-wrapper">
                            <span class="icon">👤</span>
                            <input type="text" id="soyad" placeholder="Soyadınızı girin" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="email">E-posta</label>
                        <div class="input-wrapper">
                            <span class="icon">✉</span>
                            <input type="email" id="email" placeholder="E-posta adresinizi girin" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="sifre">Şifre</label>
                        <div class="input-wrapper">
                            <span class="icon">🔒</span>
                            <input type="password" id="sifre" placeholder="Şifrenizi girin" required>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="confirmSifre">Şifre Tekrar</label>
                        <div class="input-wrapper">
                            <span class="icon">🔒</span>
                            <input type="password" id="confirmSifre" placeholder="Şifrenizi onaylayın" required>
                        </div>
                    </div>



<div class="input-group">
    <label for="dogum_gunu">Doğum Tarihi</label>
    <div class="input-wrapper">

</div>

                    <div class="input-group">
                        <label for="cinsiyet">Cinsiyet</label>

                            <span class="icon">🚻</span>
                            <select id="cinsiyet" required>
                                <option value="" disabled selected>Seçiniz</option>
                                <option value="Kadın">Kadın</option>
                                <option value="Erkek">Erkek</option>

                    <button type="submit" class="register-btn">Kayıt Ol</button>

        <div class="visual-section">
